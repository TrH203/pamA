name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not paste secrets, tokens, or private session content. If this is a leak or
        security issue, use a private security advisory instead.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you expected and what you got instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: pamA version
      description: Output of `pama --version`
  - type: dropdown
    id: os
    attributes:
      label: OS
      options: [macOS, Linux, Windows]
  - type: textarea
    id: logs
    attributes:
      label: Logs
      render: shell
