[workspace]
resolver = "2"
members = ["crates/pama-core", "crates/pama-cli", "crates/pama-desktop/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/TrH203/pama"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
regex = "1"
toml = "1"
