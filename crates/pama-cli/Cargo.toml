[package]
name = "pama-cli"
description = "The `pama` command-line tool"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "pama"
path = "src/main.rs"

[dependencies]
pama-core = { path = "../pama-core" }
anyhow.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
ulid = "3"
reqwest = { version = "0.13", features = ["blocking"] }
anstream = "1"
owo-colors = "4"
comfy-table = { version = "8", default-features = false, features = ["custom_styling"] }
indicatif = "0.18"
fs4 = { version = "0.13", features = ["sync"] }

[dev-dependencies]
tempfile = "3"
