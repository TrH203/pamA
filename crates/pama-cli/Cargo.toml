[package]
name = "pama-cli"
description = "The `pama` command-line tool"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "pama"
path = "src/main.rs"

[dependencies]
pama-core = { path = "../pama-core" }
