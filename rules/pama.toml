# pamA rules. Loaded after rules/gitleaks.toml by Layer 1 (Rust) and Layer 3 (TypeScript).
# Format: contracts/redaction-rules.md. Keep every regex RE2-compatible (no lookarounds).

title = "pamA rules"

# --- Secrets not fully covered by gitleaks -------------------------------------------------

[[rules]]
id = "connection-string-password"
description = "Password inside a database or broker connection URL"
regex = '''(?i)\b(?:postgres(?:ql)?|mysql|mariadb|mongodb(?:\+srv)?|redis|rediss|amqps?|mssql|sqlserver)://[^\s:@/]+:([^\s@/]+)@'''
secretGroup = 1
keywords = ["://"]

[[rules]]
id = "env-secret-assignment"
description = "Secret-looking environment assignment (FOO_TOKEN=..., DB_PASSWORD: ...)"
regex = '''\b[A-Z0-9_]*(?:SECRET|TOKEN|PASSWORD|PASSWD|PASSPHRASE|API_KEY|APIKEY|PRIVATE_KEY|ACCESS_KEY)[A-Z0-9_]*[ \t]*[=:][ \t]*["']?([^\s"'$<]{8,})'''
secretGroup = 1
keywords = ["secret", "token", "password", "passwd", "passphrase", "api_key", "apikey", "private_key", "access_key"]
  [[rules.allowlists]]
  regexes = ['''^\[(?:SECRET|PII):''', '''^(?:changeme|password|example|placeholder|xxxxxxxx+|\*+)$''']
  stopwords = ["example", "your-", "changeme", "placeholder"]

# --- Personal data (category = "pii") --------------------------------------------------------

[[rules]]
id = "email"
description = "Email address"
regex = '''\b[A-Za-z0-9._%+-]+@[A-Za-z0-9-]+(?:\.[A-Za-z0-9-]+)*\.[A-Za-z]{2,}\b'''
keywords = ["@"]
category = "pii"
  [[rules.allowlists]]
  regexes = ['''(?i)@(?:example\.(?:com|org|net)|users\.noreply\.github\.com)$''', '''(?i)^(?:noreply|no-reply)@''']

[[rules]]
id = "vn-phone"
description = "Vietnamese mobile phone number"
regex = '''(?:\+84|\b0)(?:3|5|7|8|9)[0-9]{8}\b'''
category = "pii"

[[rules]]
id = "vn-citizen-id"
description = "Vietnamese citizen ID (CCCD, 12 digits) near an ID keyword"
regex = '''(?i)(?:cccd|cmnd|căn cước|can cuoc|citizen id|national id)[^0-9\n]{0,20}\b(0[0-9]{11})\b'''
secretGroup = 1
keywords = ["cccd", "cmnd", "căn cước", "can cuoc", "citizen id", "national id"]
category = "pii"

[[rules]]
id = "bank-account"
description = "Bank account number near an account keyword"
regex = '''(?i)(?:stk|số tài khoản|so tai khoan|account (?:no|number)|acct)\.?\s*[:#]?\s*([0-9]{8,16})\b'''
secretGroup = 1
keywords = ["stk", "số tài khoản", "so tai khoan", "account no", "account number", "acct"]
category = "pii"

[[rules]]
id = "iban"
description = "IBAN-like account identifier"
regex = '''\b([A-Z]{2}[0-9]{2}(?:[ ]?[A-Z0-9]{4}){3,7}(?:[ ]?[A-Z0-9]{1,3})?)\b'''
secretGroup = 1
keywords = ["iban"]
category = "pii"

# --- Structural rules over normalized transcript events --------------------------------------

[[structural]]
id = "dotenv-file-read"
match = { tool = "read", path_glob = ["**/.env", "**/.env.*", "**/*.pem", "**/*.key", "**/id_rsa*", "**/id_ed25519*", "**/.npmrc", "**/.pypirc", "**/credentials", "**/.netrc"] }
action = "drop_content"

[[structural]]
id = "env-dump"
match = { tool = "bash", command_regex = '''^\s*(env|printenv|set|export -p)\s*$''' }
action = "drop_content"

[[structural]]
id = "cat-secret-file"
match = { tool = "bash", command_regex = '''(?:^|[;&|]\s*)(?:cat|less|more|head|tail|bat)\s+[^;&|]*(?:\.env\b|\.pem\b|id_rsa|id_ed25519|\.npmrc|\.netrc|credentials)''' }
action = "drop_content"
